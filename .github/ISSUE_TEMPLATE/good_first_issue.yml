name: Good First Issue
description: Beginner-friendly task with clear scope
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! 👋  
        This issue is designed for first-time contributors and has a limited, well-defined scope.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem and why does it matter?
      placeholder: |
        Example:
        The Ant build currently fails when running PMD because it uses an outdated CLI.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: What needs to be done
      description: Concrete steps or checks to complete this issue.
      value: |
        - [ ] Identify the relevant files
        - [ ] Apply the required change
        - [ ] Verify the result locally
    validations:
      required: true

  - type: textarea
    id: pointers
    attributes:
      label: Helpful pointers
      description: Relevant files, classes, documentation links, or hints for contributors
      placeholder: |
        Example:
        - build.xml (pmd target)
        - PMD 7 migration guide
